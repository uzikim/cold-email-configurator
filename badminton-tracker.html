<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>🏸 Badminton</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f0f0f;
      --surface: #1a1a1a;
      --border:  #2c2c2e;
      --text:    #ffffff;
      --muted:   #636366;
      --soft:    #aeaeb2;
      --accent:  #ffd60a;
      --red:     #ff453a;
    }

    html { height: 100%; }

    body {
      height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      position: relative;
    }

    /* ── Screens ───────────────────────────────────────────────── */
    .screen {
      display: none;
      position: absolute;
      inset: 0;
      flex-direction: column;
    }
    .screen.active { display: flex; }

    /* ── Setup ─────────────────────────────────────────────────── */
    #setup {
      align-items: center;
      justify-content: center;
      padding: 40px 28px max(52px, env(safe-area-inset-bottom, 20px));
      gap: 0;
    }

    .logo  { font-size: 46px; line-height: 1; margin-bottom: 6px; }
    .title { font-size: 26px; font-weight: 800; letter-spacing: -.5px; margin-bottom: 34px; }

    .field {
      width: 100%;
      max-width: 320px;
      margin-bottom: 13px;
    }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 7px;
    }
    .field input {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 13px;
      color: var(--text);
      font-size: 16px;
      font-weight: 600;
      padding: 16px;
      outline: none;
      -webkit-appearance: none;
      transition: border-color .18s, box-shadow .18s;
    }
    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255,214,10,.16);
    }
    .field input::placeholder { color: var(--muted); font-weight: 400; }

    /* Server picker */
    .srv-block {
      width: 100%;
      max-width: 320px;
      margin-top: 4px;
      margin-bottom: 22px;
    }
    .srv-block-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .srv-toggle {
      display: flex;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 13px;
      padding: 3px;
      gap: 3px;
    }
    .srv-opt {
      flex: 1;
      padding: 12px 8px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: background .16s, color .16s;
    }
    .srv-opt.sel {
      background: var(--accent);
      color: #000;
    }

    .start-btn {
      width: 100%;
      max-width: 320px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 700;
      padding: 18px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: opacity .15s, transform .1s;
    }
    .start-btn:active { opacity: .8; transform: scale(.98); }

    /* ── Play area ─────────────────────────────────────────────── */
    .play-area {
      flex: 1;
      display: flex;
      flex-direction: row;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }

    .tap-side {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 18px 8px 14px;
      border: none;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
      overflow: hidden;
      transition: background .15s;
    }

    /* Serving: gold top stripe */
    .tap-side::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--accent);
      opacity: 0;
      transition: opacity .25s;
    }
    .tap-side.serving::before { opacity: 1; }
    .tap-side.serving { background: rgba(255,214,10,.028); }

    /* Tap flash */
    .tap-side::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,.055);
      opacity: 0;
      transition: opacity .12s;
      pointer-events: none;
    }
    .tap-side:active::after { opacity: 1; }

    /* Serving badge row */
    .srv-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 18px;
      opacity: 0;
      transition: opacity .25s;
    }
    .tap-side.serving .srv-badge { opacity: 1; }

    .srv-badge-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }
    .srv-badge-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.8px;
      color: var(--accent);
    }

    /* Court position */
    .court-pos {
      height: 14px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      transition: opacity .25s;
    }
    .tap-side.serving .court-pos { opacity: 1; }

    .side-name {
      font-size: 17px;
      font-weight: 600;
      color: var(--soft);
      max-width: 145px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: 2px;
    }

    .pips {
      display: flex;
      gap: 8px;
    }
    .pip {
      width: 11px; height: 11px;
      border-radius: 50%;
      border: 2px solid #3a3a3c;
      background: transparent;
      transition: border-color .2s, background .2s;
    }
    .pip.on { border-color: var(--accent); background: var(--accent); }

    .side-score {
      font-size: clamp(80px, 25vw, 150px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -5px;
      font-variant-numeric: tabular-nums;
      margin-top: 4px;
      transition: color .2s;
    }
    .side-score.ahead { color: var(--accent); }

    @keyframes scorePop {
      0%   { transform: scale(1); }
      45%  { transform: scale(1.12); }
      100% { transform: scale(1); }
    }
    .side-score.pop { animation: scorePop .18s ease-out; }

    /* Center divider */
    .divider {
      width: 1px;
      align-self: stretch;
      background: var(--border);
      flex-shrink: 0;
    }

    /* ── Paused overlay ────────────────────────────────────────── */
    .pause-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.75);
      z-index: 20;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
    }
    .pause-overlay.on { display: flex; }

    .pause-word {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 6px;
      color: var(--accent);
    }

    .resume-btn {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 13px;
      font-size: 16px;
      font-weight: 700;
      padding: 15px 44px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: opacity .15s;
    }
    .resume-btn:active { opacity: .8; }

    /* ── Bottom bar ────────────────────────────────────────────── */
    .bottom {
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      padding: 9px 14px max(13px, env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .hist {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      min-height: 15px;
      letter-spacing: .2px;
    }

    .btns {
      display: flex;
      gap: 10px;
    }

    .ctrl {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--soft);
      font-size: 15px;
      font-weight: 600;
      padding: 13px 6px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: background .12s, color .12s;
    }
    .ctrl:active { background: #2a2a2a; color: var(--text); }

    /* ── Won screen ────────────────────────────────────────────── */
    #won {
      align-items: center;
      justify-content: center;
      padding: 44px 28px max(44px, env(safe-area-inset-bottom, 20px));
      gap: 13px;
      text-align: center;
    }

    .won-trophy { font-size: 70px; line-height: 1; }
    .won-name   { font-size: 46px; font-weight: 900; letter-spacing: -2px; color: var(--accent); }
    .won-sub    { font-size: 18px; color: var(--muted); margin-top: -4px; }
    .won-sets   { font-size: 20px; font-weight: 700; color: var(--soft); margin-top: 4px; }
    .won-hist   { font-size: 14px; color: var(--muted); line-height: 2.1; white-space: pre; margin-top: 4px; }

    .new-game-btn {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 700;
      padding: 18px 52px;
      margin-top: 14px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: opacity .15s, transform .1s;
    }
    .new-game-btn:active { opacity: .8; transform: scale(.97); }

    /* ── Reset modal ───────────────────────────────────────────── */
    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 24px;
    }
    .modal-bg.on { display: flex; }

    .modal {
      background: #1e1e20;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px 20px;
      width: 100%;
      max-width: 290px;
      text-align: center;
    }
    .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
    .modal-sub   { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 22px; }
    .modal-row   { display: flex; gap: 10px; }

    .m-cancel {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--soft);
      font-size: 15px;
      font-weight: 600;
      padding: 14px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .m-cancel:active { background: #2a2a2a; }

    .m-confirm {
      flex: 1;
      background: var(--red);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      padding: 14px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .m-confirm:active { opacity: .8; }
  </style>
</head>
<body>

<!-- ═══ SETUP ═══════════════════════════════════════════════════ -->
<div class="screen active" id="setup">
  <div class="logo">🏸</div>
  <div class="title">Badminton</div>

  <div class="field">
    <label>Player 1</label>
    <input id="n0" type="text" placeholder="Enter name" maxlength="14"
           autocomplete="off" spellcheck="false"
           oninput="syncSrvLabel(0,this.value)"
           onkeydown="if(event.key==='Enter')document.getElementById('n1').focus()">
  </div>

  <div class="field">
    <label>Player 2</label>
    <input id="n1" type="text" placeholder="Enter name" maxlength="14"
           autocomplete="off" spellcheck="false"
           oninput="syncSrvLabel(1,this.value)"
           onkeydown="if(event.key==='Enter')startGame()">
  </div>

  <div class="srv-block">
    <div class="srv-block-label">Who serves first?</div>
    <div class="srv-toggle">
      <button class="srv-opt sel" id="srv0" onclick="pickServer(0)">Player 1</button>
      <button class="srv-opt"     id="srv1" onclick="pickServer(1)">Player 2</button>
    </div>
  </div>

  <button class="start-btn" onclick="startGame()">Start Game</button>
</div>

<!-- ═══ GAME ════════════════════════════════════════════════════ -->
<div class="screen" id="game">

  <div class="play-area" id="playArea">

    <!-- Left: Player 0 -->
    <button class="tap-side" id="side0" onclick="addPoint(0)">
      <div class="srv-badge">
        <div class="srv-badge-dot"></div>
        <div class="srv-badge-label">SERVING</div>
      </div>
      <div class="court-pos" id="court0"></div>
      <div class="side-name"  id="sname0"></div>
      <div class="pips">
        <div class="pip" id="pip0-0"></div>
        <div class="pip" id="pip0-1"></div>
      </div>
      <div class="side-score" id="score0">0</div>
    </button>

    <div class="divider"></div>

    <!-- Right: Player 1 -->
    <button class="tap-side" id="side1" onclick="addPoint(1)">
      <div class="srv-badge">
        <div class="srv-badge-dot"></div>
        <div class="srv-badge-label">SERVING</div>
      </div>
      <div class="court-pos" id="court1"></div>
      <div class="side-name"  id="sname1"></div>
      <div class="pips">
        <div class="pip" id="pip1-0"></div>
        <div class="pip" id="pip1-1"></div>
      </div>
      <div class="side-score" id="score1">0</div>
    </button>

    <!-- Paused overlay -->
    <div class="pause-overlay" id="pauseOverlay">
      <div class="pause-word">PAUSED</div>
      <button class="resume-btn" onclick="togglePause()">▶&nbsp; Resume</button>
    </div>

  </div><!-- /play-area -->

  <div class="bottom">
    <div class="hist" id="hist"></div>
    <div class="btns">
      <button class="ctrl" id="pauseBtn" onclick="togglePause()">⏸&nbsp; Pause</button>
      <button class="ctrl" onclick="openReset()">↺&nbsp; Reset</button>
    </div>
  </div>

</div><!-- /game -->

<!-- ═══ WON ══════════════════════════════════════════════════════ -->
<div class="screen" id="won">
  <div class="won-trophy">🏆</div>
  <div class="won-name" id="wonName"></div>
  <div class="won-sub">wins the match!</div>
  <div class="won-sets" id="wonSets"></div>
  <div class="won-hist" id="wonHist"></div>
  <button class="new-game-btn" onclick="goSetup()">New Game</button>
</div>

<!-- ═══ RESET MODAL ══════════════════════════════════════════════ -->
<div class="modal-bg" id="resetModal">
  <div class="modal">
    <div class="modal-title">Reset match?</div>
    <div class="modal-sub">Scores back to zero — same players.</div>
    <div class="modal-row">
      <button class="m-cancel"  onclick="closeReset()">Cancel</button>
      <button class="m-confirm" onclick="doReset()">Reset</button>
    </div>
  </div>
</div>

<script>
// ── State ───────────────────────────────────────────────────────────────────
const G = {
  p: [
    { name: '', pts: 0, sets: 0 },
    { name: '', pts: 0, sets: 0 },
  ],
  server:     0,   // current server index
  initServer: 0,   // server chosen at setup (used when resetting)
  history:    [],  // [{a, b}] per completed set
  phase:      'setup',  // setup | playing | paused | won
};

// ── Audio ────────────────────────────────────────────────────────────────────
let actx = null;

function ctx() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  return actx;
}

function playClick() {
  try {
    const c = ctx(), o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination);
    o.type = 'triangle';
    o.frequency.setValueAtTime(520, c.currentTime);
    o.frequency.exponentialRampToValueAtTime(170, c.currentTime + 0.065);
    g.gain.setValueAtTime(0.42, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.075);
    o.start(); o.stop(c.currentTime + 0.075);
  } catch(e) {}
}

function playCelebration(isMatch) {
  try {
    const c    = ctx();
    const seq  = isMatch ? [523,659,784,523,659,784,1047,1319] : [523,659,784,1047];
    const gap  = isMatch ? 0.09  : 0.11;
    const hold = isMatch ? 0.46  : 0.29;
    seq.forEach((hz, i) => {
      const o = c.createOscillator(), g = c.createGain();
      o.connect(g); g.connect(c.destination);
      o.type = 'sine'; o.frequency.value = hz;
      const t = c.currentTime + i * gap;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.28, t + 0.025);
      g.gain.exponentialRampToValueAtTime(0.001, t + hold);
      o.start(t); o.stop(t + hold);
    });
  } catch(e) {}
}

// ── Setup helpers ────────────────────────────────────────────────────────────
function syncSrvLabel(i, val) {
  document.getElementById('srv' + i).textContent = val.trim() || 'Player ' + (i + 1);
}

function pickServer(i) {
  G.initServer = i;
  document.getElementById('srv0').classList.toggle('sel', i === 0);
  document.getElementById('srv1').classList.toggle('sel', i === 1);
}

// ── Game control ─────────────────────────────────────────────────────────────
function startGame() {
  G.p[0].name = (document.getElementById('n0').value.trim() || 'Player 1').slice(0, 14);
  G.p[1].name = (document.getElementById('n1').value.trim() || 'Player 2').slice(0, 14);
  G.p[0].pts  = G.p[1].pts  = 0;
  G.p[0].sets = G.p[1].sets = 0;
  G.history   = [];
  G.server    = G.initServer;
  G.phase     = 'playing';
  ctx(); // unlock audio on this user gesture
  resetUI();
  showScreen('game');
  render();
}

function goSetup() {
  G.phase = 'setup';
  showScreen('setup');
}

function addPoint(i) {
  if (G.phase !== 'playing') return;

  G.p[i].pts++;
  playClick();
  popScore(i);

  // Serve switches only when the receiver wins the rally
  if (i !== G.server) G.server = i;

  const a = G.p[0].pts, b = G.p[1].pts;
  const winner = (a >= 21 && a - b >= 2) ? 0
               : (b >= 21 && b - a >= 2) ? 1 : -1;

  if (winner !== -1) {
    G.history.push({ a, b });
    G.p[winner].sets++;
    G.p[0].pts = G.p[1].pts = 0;
    // Winner of the set serves first in the next set (BWF rules)
    G.server = winner;

    const matchOver = G.p[winner].sets >= 2;
    playCelebration(matchOver);

    if (matchOver) {
      G.phase = 'won';
      render();
      setTimeout(() => showWon(winner), 820);
      return;
    }
  }
  render();
}

function showWon(w) {
  const l = 1 - w;
  document.getElementById('wonName').textContent = G.p[w].name;
  document.getElementById('wonSets').textContent = `${G.p[w].sets} – ${G.p[l].sets}`;
  document.getElementById('wonHist').textContent =
    G.history.map((s, i) => `Set ${i + 1}:  ${s.a} – ${s.b}`).join('\n');
  showScreen('won');
}

// ── Pause ────────────────────────────────────────────────────────────────────
function togglePause() {
  if (G.phase === 'playing') {
    G.phase = 'paused';
    document.getElementById('pauseOverlay').classList.add('on');
    document.getElementById('pauseBtn').innerHTML = '▶&nbsp; Resume';
  } else if (G.phase === 'paused') {
    G.phase = 'playing';
    document.getElementById('pauseOverlay').classList.remove('on');
    document.getElementById('pauseBtn').innerHTML = '⏸&nbsp; Pause';
  }
}

// ── Reset ────────────────────────────────────────────────────────────────────
function openReset()  { document.getElementById('resetModal').classList.add('on'); }
function closeReset() { document.getElementById('resetModal').classList.remove('on'); }

function doReset() {
  closeReset();
  G.p[0].pts  = G.p[1].pts  = 0;
  G.p[0].sets = G.p[1].sets = 0;
  G.history   = [];
  G.server    = G.initServer;
  G.phase     = 'playing';
  resetUI();
  render();
}

function resetUI() {
  document.getElementById('pauseOverlay').classList.remove('on');
  document.getElementById('pauseBtn').innerHTML = '⏸&nbsp; Pause';
}

// ── Render ───────────────────────────────────────────────────────────────────
function render() {
  for (let i = 0; i < 2; i++) {
    const serving = i === G.server;
    document.getElementById('side'  + i).classList.toggle('serving', serving);
    document.getElementById('sname' + i).textContent = G.p[i].name;

    // Court position based on server's current score
    // Even score → RIGHT, odd score → LEFT  (server's perspective)
    document.getElementById('court' + i).textContent =
      G.p[i].pts % 2 === 0 ? 'RIGHT COURT' : 'LEFT COURT';

    const sc = document.getElementById('score' + i);
    sc.textContent = G.p[i].pts;
    sc.classList.toggle('ahead', G.p[i].pts > G.p[1 - i].pts);

    for (let s = 0; s < 2; s++)
      document.getElementById(`pip${i}-${s}`).classList.toggle('on', s < G.p[i].sets);
  }

  document.getElementById('hist').textContent =
    G.history.map((s, i) => `Set ${i + 1}: ${s.a}–${s.b}`).join('  ·  ');
}

function popScore(i) {
  const el = document.getElementById('score' + i);
  el.classList.remove('pop');
  void el.offsetWidth;  // force reflow so animation restarts on rapid taps
  el.classList.add('pop');
}

// ── Screen switching ─────────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
</script>
</body>
</html>
